name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Format, Clippy & Tests
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Cargo version and resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          SEMVER_RE = re.compile(
              r"\A(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?\Z",
              re.ASCII,
          )

          with open("Cargo.toml", "rb") as fh:
              cargo = tomllib.load(fh)

          version = cargo.get("package", {}).get("version")
          match = SEMVER_RE.fullmatch(version) if isinstance(version, str) else None
          if match is None:
              print(f"Error: Cargo.toml package.version '{version}' is not valid SemVer 2.0.0.", file=sys.stderr)
              sys.exit(1)

          expected_tag = f"v{version}"
          if "\r" in expected_tag or "\n" in expected_tag:
              print("Error: resolved release tag contains invalid newline characters.", file=sys.stderr)
              sys.exit(1)

          pkg_ver = version.replace("-", ".")
          if not re.fullmatch(r"[A-Za-z0-9._+~]+", pkg_ver):
              print(f"Error: normalized pkgver '{pkg_ver}' contains invalid characters for makepkg.", file=sys.stderr)
              sys.exit(1)

          is_prerelease = "true" if match.group(4) is not None else "false"

          event_name = os.environ.get("EVENT_NAME", "")
          ref_name = os.environ.get("REF_NAME", "")
          ref_type = os.environ.get("REF_TYPE", "")

          if event_name == "push":
              if ref_type == "tag":
                  if ref_name != expected_tag:
                      print(f"Error: tag '{ref_name}' does not match Cargo.toml version '{expected_tag}'.", file=sys.stderr)
                      sys.exit(1)
              elif ref_type != "branch" or ref_name != "master":
                  print(
                      f"Error: push release requires refs/heads/master or matching SemVer tag (got ref_type='{ref_type}', ref='{ref_name}').",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          elif event_name == "workflow_dispatch":
              if ref_type != "branch" or ref_name != "master":
                  print(
                      f"Error: workflow_dispatch release requires refs/heads/master (got ref_type='{ref_type}', ref='{ref_name}').",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          else:
              print(f"Error: unsupported event '{event_name}' for release workflow.", file=sys.stderr)
              sys.exit(1)

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"tag={expected_tag}\n")
              fh.write(f"pkgver={pkg_ver}\n")
              fh.write(f"is_prerelease={is_prerelease}\n")

          print(f"Resolved release tag: {expected_tag} (pkgver={pkg_ver}, prerelease={is_prerelease}, event={event_name})")
          PY

      - name: Verify tagged commit is an ancestor of master
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/heads/master...${GITHUB_SHA}" --jq '.status')"
          case "${STATUS}" in
            identical|behind)
              echo "Verified ${GITHUB_SHA} ancestry on master (compare status=${STATUS})."
              ;;
            *)
              echo "Error: tagged commit ${GITHUB_SHA} is not an ancestor of master (compare status=${STATUS})." >&2
              exit 1
              ;;
          esac

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --locked --all-features

  build:
    name: Build Static Musl (${{ matrix.target }})
    needs: [check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bin_name: install-in-arch-linux-x86_64
            cc_env: CC_x86_64_unknown_linux_musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            bin_name: install-in-arch-linux-aarch64
            cc_env: CC_aarch64_unknown_linux_musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "${TARGET}"
          rustup default stable

      - name: Build static musl release binary and package assets
        env:
          TAG: ${{ needs.check.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          CC_ENV_VAR: ${{ matrix.cc_env }}
        run: |
          set -euo pipefail
          export "${CC_ENV_VAR}=musl-gcc"
          export RUSTFLAGS="-C target-feature=+crt-static"

          cargo build --release --locked --target "${TARGET}"

          BIN_PATH="target/${TARGET}/release/install-in-arch"
          strip "${BIN_PATH}"

          file "${BIN_PATH}"
          file "${BIN_PATH}" | grep -iE 'static|statically'
          "${BIN_PATH}" --version

          rm -rf dist staging
          mkdir -p dist staging/completions staging/man

          "${BIN_PATH}" --generate-completion bash > staging/completions/install-in-arch.bash
          "${BIN_PATH}" --generate-completion zsh > staging/completions/_install-in-arch
          "${BIN_PATH}" --generate-completion fish > staging/completions/install-in-arch.fish
          "${BIN_PATH}" --generate-man | gzip -9n > staging/man/install-in-arch.1.gz
          test -s staging/completions/install-in-arch.bash
          test -s staging/completions/_install-in-arch
          test -s staging/completions/install-in-arch.fish
          test -s staging/man/install-in-arch.1.gz

          install -m 0755 "${BIN_PATH}" staging/install-in-arch
          install -m 0644 README.md staging/README.md
          install -m 0644 LICENSE-MIT staging/LICENSE-MIT
          install -m 0644 LICENSE-APACHE staging/LICENSE-APACHE
          tar -czf "dist/install-in-arch-${TAG}-${TARGET}.tar.gz" -C staging install-in-arch README.md LICENSE-MIT LICENSE-APACHE completions man

          if [ "${TARGET}" = "x86_64-unknown-linux-musl" ]; then
            install -m 0644 staging/completions/install-in-arch.bash dist/install-in-arch.bash
            install -m 0644 staging/completions/_install-in-arch dist/_install-in-arch
            install -m 0644 staging/completions/install-in-arch.fish dist/install-in-arch.fish
            install -m 0644 staging/man/install-in-arch.1.gz dist/install-in-arch.1.gz
          fi

          install -m 0755 "${BIN_PATH}" "dist/${BIN_NAME}"
          ls -lh dist/

      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  smoke-archlinux:
    name: Smoke Test Static Musl on Arch Linux
    needs: [check, build]
    runs-on: ubuntu-24.04
    container: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899

    steps:
      - name: Download x86_64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-unknown-linux-musl
          path: dist

      - name: Validate static musl binary, tarball and synthetic .deb against real pacman
        env:
          TAG: ${{ needs.check.outputs.tag }}
          PKG_VER: ${{ needs.check.outputs.pkgver }}
        run: |
          set -euo pipefail
          sed -i '/^NoExtract/d' /etc/pacman.conf
          chmod +x dist/install-in-arch-linux-x86_64
          ./dist/install-in-arch-linux-x86_64 --version
          ./dist/install-in-arch-linux-x86_64 --help
          ./dist/install-in-arch-linux-x86_64 --list

          rm -rf /tmp/smoke_tar /tmp/smoke_deb /tmp/smoke_out /tmp/smoke.deb
          mkdir -p /tmp/smoke_tar /tmp/smoke_deb/ctrl /tmp/smoke_deb/data/usr/bin /tmp/smoke_out

          tar -xzf "dist/install-in-arch-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C /tmp/smoke_tar
          test -f /tmp/smoke_tar/README.md
          test -f /tmp/smoke_tar/LICENSE-MIT
          test -f /tmp/smoke_tar/LICENSE-APACHE
          test -f /tmp/smoke_tar/completions/install-in-arch.bash
          test -f /tmp/smoke_tar/completions/_install-in-arch
          test -f /tmp/smoke_tar/completions/install-in-arch.fish
          test -f /tmp/smoke_tar/man/install-in-arch.1.gz
          test -x /tmp/smoke_tar/install-in-arch
          /tmp/smoke_tar/install-in-arch --version
          /tmp/smoke_tar/install-in-arch --help
          /tmp/smoke_tar/install-in-arch --list

          printf '2.0\n' > /tmp/smoke_deb/debian-binary
          printf 'Package: install-in-arch-smoke-deb\nVersion: 1.0.0\nArchitecture: amd64\nDescription: Smoke test package\n' > /tmp/smoke_deb/ctrl/control
          printf '#!/bin/sh\necho smoke\n' > /tmp/smoke_deb/data/usr/bin/install-in-arch-smoke-deb
          chmod 0755 /tmp/smoke_deb/data/usr/bin/install-in-arch-smoke-deb
          tar -czf /tmp/smoke_deb/control.tar.gz -C /tmp/smoke_deb/ctrl control
          tar -czf /tmp/smoke_deb/data.tar.gz -C /tmp/smoke_deb/data usr
          bsdtar --format=arsvr4 -cf /tmp/smoke.deb -C /tmp/smoke_deb debian-binary control.tar.gz data.tar.gz

          /tmp/smoke_tar/install-in-arch --dry-run --ignore-deps --keep-pkg /tmp/smoke_out /tmp/smoke.deb
          PKG_FILE="/tmp/smoke_out/install-in-arch-smoke-deb-1.0.0-1-x86_64.pkg.tar.zst"
          test -f "${PKG_FILE}"
          pacman -Qpi "${PKG_FILE}"
          pacman -Qpl "${PKG_FILE}"
          pacman -Qpl "${PKG_FILE}" | grep -qx 'install-in-arch-smoke-deb /usr/bin/install-in-arch-smoke-deb'
          pacman -U --noconfirm "${PKG_FILE}"
          pacman -Qkk install-in-arch-smoke-deb
          pacman -R --noconfirm install-in-arch-smoke-deb

          rm -rf /tmp/self_deb /tmp/self_pkg_out pkg_dist
          mkdir -p \
            /tmp/self_deb/ctrl \
            /tmp/self_deb/data/usr/bin \
            /tmp/self_deb/data/usr/share/doc/install-in-arch \
            /tmp/self_deb/data/usr/share/licenses/install-in-arch \
            /tmp/self_deb/data/usr/share/bash-completion/completions \
            /tmp/self_deb/data/usr/share/zsh/site-functions \
            /tmp/self_deb/data/usr/share/fish/vendor_completions.d \
            /tmp/self_deb/data/usr/share/man/man1 \
            /tmp/self_pkg_out \
            pkg_dist
          printf '2.0\n' > /tmp/self_deb/debian-binary
          printf 'Package: install-in-arch\nVersion: %s\nArchitecture: amd64\nHomepage: https://github.com/passella/install-in-arch\nLicense: MIT OR Apache-2.0\nDescription: Native converter and package manager (.deb / .rpm / .apk -> .pkg.tar.zst) in Rust for Arch Linux\n' "${PKG_VER}" > /tmp/self_deb/ctrl/control
          install -m 0755 /tmp/smoke_tar/install-in-arch /tmp/self_deb/data/usr/bin/install-in-arch
          install -m 0644 /tmp/smoke_tar/README.md /tmp/self_deb/data/usr/share/doc/install-in-arch/README.md
          install -m 0644 /tmp/smoke_tar/LICENSE-MIT /tmp/self_deb/data/usr/share/licenses/install-in-arch/LICENSE-MIT
          install -m 0644 /tmp/smoke_tar/LICENSE-APACHE /tmp/self_deb/data/usr/share/licenses/install-in-arch/LICENSE-APACHE
          install -m 0644 /tmp/smoke_tar/completions/install-in-arch.bash /tmp/self_deb/data/usr/share/bash-completion/completions/install-in-arch
          install -m 0644 /tmp/smoke_tar/completions/_install-in-arch /tmp/self_deb/data/usr/share/zsh/site-functions/_install-in-arch
          install -m 0644 /tmp/smoke_tar/completions/install-in-arch.fish /tmp/self_deb/data/usr/share/fish/vendor_completions.d/install-in-arch.fish
          install -m 0644 /tmp/smoke_tar/man/install-in-arch.1.gz /tmp/self_deb/data/usr/share/man/man1/install-in-arch.1.gz
          tar -czf /tmp/self_deb/control.tar.gz -C /tmp/self_deb/ctrl control
          tar -czf /tmp/self_deb/data.tar.gz -C /tmp/self_deb/data usr
          bsdtar --format=arsvr4 -cf /tmp/self_deb/install-in-arch.deb -C /tmp/self_deb debian-binary control.tar.gz data.tar.gz

          /tmp/smoke_tar/install-in-arch --dry-run --ignore-deps --keep-pkg /tmp/self_pkg_out /tmp/self_deb/install-in-arch.deb
          SELF_PKG="/tmp/self_pkg_out/install-in-arch-${PKG_VER}-1-x86_64.pkg.tar.zst"
          test -f "${SELF_PKG}"
          pacman -Qpi "${SELF_PKG}"
          pacman -Qpi "${SELF_PKG}" | grep -q 'MIT OR Apache-2.0'
          pacman -Qpl "${SELF_PKG}" | grep -qx 'install-in-arch /usr/share/licenses/install-in-arch/LICENSE-MIT'
          pacman -Qpl "${SELF_PKG}" | grep -qx 'install-in-arch /usr/share/licenses/install-in-arch/LICENSE-APACHE'
          pacman -U --noconfirm "${SELF_PKG}"
          pacman -Qkk install-in-arch
          /usr/bin/install-in-arch --version
          pacman -R --noconfirm install-in-arch
          install -m 0644 "${SELF_PKG}" pkg_dist/
          rm -rf /tmp/self_pkg_out /tmp/self_deb

      - name: Validate synthetic .rpm and .apk against real pacman
        run: |
          set -euo pipefail
          if [ ! -r /etc/pacman.d/gnupg/pubring.gpg ] || [ ! -r /etc/pacman.d/gnupg/trustdb.gpg ] || ! gpg --homedir /etc/pacman.d/gnupg --with-colons --list-secret-keys 2>/dev/null | grep '^sec:' >/dev/null; then
            pacman-key --init
            pacman-key --populate archlinux
          fi
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm rpm-tools

          rm -rf /tmp/rpmbuild /tmp/smoke_rpm_out /tmp/smoke_apk /tmp/smoke_apk_out
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} /tmp/smoke_rpm_out /tmp/smoke_apk/ctrl /tmp/smoke_apk/data/usr/bin /tmp/smoke_apk_out

          cat <<'SPEC' > /tmp/rpmbuild/SPECS/install-in-arch-smoke-rpm.spec
          %global debug_package %{nil}
          Name: install-in-arch-smoke-rpm
          Version: 1.0.0
          Release: 1
          Summary: Smoke test RPM package
          License: MIT
          BuildArch: x86_64

          %description
          Synthetic RPM package for Arch Linux smoke validation.

          %install
          mkdir -p %{buildroot}/usr/bin
          printf '#!/bin/sh\necho smoke-rpm\n' > %{buildroot}/usr/bin/install-in-arch-smoke-rpm
          chmod 0755 %{buildroot}/usr/bin/install-in-arch-smoke-rpm

          %files
          /usr/bin/install-in-arch-smoke-rpm
          SPEC

          rpmbuild -bb --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/install-in-arch-smoke-rpm.spec
          RPM_FILE="/tmp/rpmbuild/RPMS/x86_64/install-in-arch-smoke-rpm-1.0.0-1.x86_64.rpm"
          test -f "${RPM_FILE}"

          /tmp/smoke_tar/install-in-arch --dry-run --ignore-deps --keep-pkg /tmp/smoke_rpm_out "${RPM_FILE}"
          PKG_FILE="/tmp/smoke_rpm_out/install-in-arch-smoke-rpm-1.0.0-1-x86_64.pkg.tar.zst"
          test -f "${PKG_FILE}"
          pacman -Qpi "${PKG_FILE}"
          pacman -Qpl "${PKG_FILE}"
          pacman -Qpl "${PKG_FILE}" | grep -qx 'install-in-arch-smoke-rpm /usr/bin/install-in-arch-smoke-rpm'
          pacman -U --noconfirm "${PKG_FILE}"
          pacman -Qkk install-in-arch-smoke-rpm
          pacman -R --noconfirm install-in-arch-smoke-rpm

          printf '#!/bin/sh\necho smoke-apk\n' > /tmp/smoke_apk/data/usr/bin/install-in-arch-smoke-apk
          chmod 0755 /tmp/smoke_apk/data/usr/bin/install-in-arch-smoke-apk
          tar -czf /tmp/smoke_apk/data.tar.gz -C /tmp/smoke_apk/data usr
          APK_DATAHASH="$(sha256sum /tmp/smoke_apk/data.tar.gz | awk '{print $1}')"
          printf 'pkgname = install-in-arch-smoke-apk\npkgver = 1.0.0-r0\npkgdesc = Smoke test APK package\narch = x86_64\ndatahash = %s\n' "${APK_DATAHASH}" > /tmp/smoke_apk/ctrl/.PKGINFO
          tar -czf /tmp/smoke_apk/control.tar.gz -C /tmp/smoke_apk/ctrl .PKGINFO
          cat /tmp/smoke_apk/control.tar.gz /tmp/smoke_apk/data.tar.gz > /tmp/smoke_apk/smoke.apk

          /tmp/smoke_tar/install-in-arch --dry-run --ignore-deps --keep-pkg /tmp/smoke_apk_out /tmp/smoke_apk/smoke.apk
          APK_PKG_FILE="/tmp/smoke_apk_out/install-in-arch-smoke-apk-1.0.0-1-x86_64.pkg.tar.zst"
          test -f "${APK_PKG_FILE}"
          pacman -Qpi "${APK_PKG_FILE}"
          pacman -Qpl "${APK_PKG_FILE}"
          pacman -Qpl "${APK_PKG_FILE}" | grep -qx 'install-in-arch-smoke-apk /usr/bin/install-in-arch-smoke-apk'
          pacman -U --noconfirm "${APK_PKG_FILE}"
          pacman -Qkk install-in-arch-smoke-apk
          pacman -R --noconfirm install-in-arch-smoke-apk

      - name: Upload native Arch Linux package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archlinux-pkg-x86_64
          path: pkg_dist/
          if-no-files-found: error

  smoke-aarch64:
    name: Smoke Test Static Musl (aarch64)
    needs: [check, build]
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download aarch64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-unknown-linux-musl
          path: dist

      - name: Validate static musl binary, tarball, synthetic .deb and build native aarch64 package
        env:
          TAG: ${{ needs.check.outputs.tag }}
          PKG_VER: ${{ needs.check.outputs.pkgver }}
        run: |
          set -euo pipefail
          chmod +x dist/install-in-arch-linux-aarch64
          ./dist/install-in-arch-linux-aarch64 --version
          ./dist/install-in-arch-linux-aarch64 --help

          rm -rf /tmp/smoke_arm_tar /tmp/smoke_arm_deb /tmp/smoke_arm_out /tmp/smoke_arm.deb
          mkdir -p /tmp/smoke_arm_tar /tmp/smoke_arm_deb/ctrl /tmp/smoke_arm_deb/data/usr/bin /tmp/smoke_arm_out

          tar -xzf "dist/install-in-arch-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C /tmp/smoke_arm_tar
          test -f /tmp/smoke_arm_tar/README.md
          test -f /tmp/smoke_arm_tar/LICENSE-MIT
          test -f /tmp/smoke_arm_tar/LICENSE-APACHE
          test -f /tmp/smoke_arm_tar/completions/install-in-arch.bash
          test -f /tmp/smoke_arm_tar/completions/_install-in-arch
          test -f /tmp/smoke_arm_tar/completions/install-in-arch.fish
          test -f /tmp/smoke_arm_tar/man/install-in-arch.1.gz
          test -x /tmp/smoke_arm_tar/install-in-arch
          /tmp/smoke_arm_tar/install-in-arch --version
          /tmp/smoke_arm_tar/install-in-arch --help

          printf '2.0\n' > /tmp/smoke_arm_deb/debian-binary
          printf 'Package: smoke-arm\nVersion: 1.0.0\nArchitecture: arm64\nDescription: Smoke test ARM64 package\n' > /tmp/smoke_arm_deb/ctrl/control
          printf '#!/bin/sh\necho smoke-arm\n' > /tmp/smoke_arm_deb/data/usr/bin/smoke-arm
          chmod 0755 /tmp/smoke_arm_deb/data/usr/bin/smoke-arm
          tar -czf /tmp/smoke_arm_deb/control.tar.gz -C /tmp/smoke_arm_deb/ctrl control
          tar -czf /tmp/smoke_arm_deb/data.tar.gz -C /tmp/smoke_arm_deb/data usr
          (
            cd /tmp/smoke_arm_deb
            ar rcs /tmp/smoke_arm.deb debian-binary control.tar.gz data.tar.gz
          )

          /tmp/smoke_arm_tar/install-in-arch --dry-run --ignore-deps --keep-pkg /tmp/smoke_arm_out /tmp/smoke_arm.deb
          PKG_FILE="/tmp/smoke_arm_out/smoke-arm-1.0.0-1-aarch64.pkg.tar.zst"
          test -s "${PKG_FILE}"
          ls -lh "${PKG_FILE}"

          rm -rf /tmp/self_arm_deb pkg_dist
          mkdir -p \
            /tmp/self_arm_deb/ctrl \
            /tmp/self_arm_deb/data/usr/bin \
            /tmp/self_arm_deb/data/usr/share/doc/install-in-arch \
            /tmp/self_arm_deb/data/usr/share/licenses/install-in-arch \
            /tmp/self_arm_deb/data/usr/share/bash-completion/completions \
            /tmp/self_arm_deb/data/usr/share/zsh/site-functions \
            /tmp/self_arm_deb/data/usr/share/fish/vendor_completions.d \
            /tmp/self_arm_deb/data/usr/share/man/man1 \
            pkg_dist
          printf '2.0\n' > /tmp/self_arm_deb/debian-binary
          printf 'Package: install-in-arch\nVersion: %s\nArchitecture: arm64\nHomepage: https://github.com/passella/install-in-arch\nLicense: MIT OR Apache-2.0\nDescription: Native converter and package manager (.deb / .rpm / .apk -> .pkg.tar.zst) in Rust for Arch Linux\n' "${PKG_VER}" > /tmp/self_arm_deb/ctrl/control
          install -m 0755 /tmp/smoke_arm_tar/install-in-arch /tmp/self_arm_deb/data/usr/bin/install-in-arch
          install -m 0644 /tmp/smoke_arm_tar/README.md /tmp/self_arm_deb/data/usr/share/doc/install-in-arch/README.md
          install -m 0644 /tmp/smoke_arm_tar/LICENSE-MIT /tmp/self_arm_deb/data/usr/share/licenses/install-in-arch/LICENSE-MIT
          install -m 0644 /tmp/smoke_arm_tar/LICENSE-APACHE /tmp/self_arm_deb/data/usr/share/licenses/install-in-arch/LICENSE-APACHE
          install -m 0644 /tmp/smoke_arm_tar/completions/install-in-arch.bash /tmp/self_arm_deb/data/usr/share/bash-completion/completions/install-in-arch
          install -m 0644 /tmp/smoke_arm_tar/completions/_install-in-arch /tmp/self_arm_deb/data/usr/share/zsh/site-functions/_install-in-arch
          install -m 0644 /tmp/smoke_arm_tar/completions/install-in-arch.fish /tmp/self_arm_deb/data/usr/share/fish/vendor_completions.d/install-in-arch.fish
          install -m 0644 /tmp/smoke_arm_tar/man/install-in-arch.1.gz /tmp/self_arm_deb/data/usr/share/man/man1/install-in-arch.1.gz
          tar -czf /tmp/self_arm_deb/control.tar.gz -C /tmp/self_arm_deb/ctrl control
          tar -czf /tmp/self_arm_deb/data.tar.gz -C /tmp/self_arm_deb/data usr
          (
            cd /tmp/self_arm_deb
            ar rcs /tmp/self_arm_deb/install-in-arch.deb debian-binary control.tar.gz data.tar.gz
          )

          /tmp/smoke_arm_tar/install-in-arch --dry-run --ignore-deps --keep-pkg pkg_dist /tmp/self_arm_deb/install-in-arch.deb
          SELF_PKG="pkg_dist/install-in-arch-${PKG_VER}-1-aarch64.pkg.tar.zst"
          test -s "${SELF_PKG}"
          command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          PKGINFO_CONTENT="$(tar --zstd -xOf "${SELF_PKG}" .PKGINFO)"
          printf '%s\n' "${PKGINFO_CONTENT}"
          printf '%s\n' "${PKGINFO_CONTENT}" | grep -qx 'pkgname = install-in-arch'
          printf '%s\n' "${PKGINFO_CONTENT}" | grep -qx "pkgver = ${PKG_VER}-1"
          printf '%s\n' "${PKGINFO_CONTENT}" | grep -qx 'arch = aarch64'
          printf '%s\n' "${PKGINFO_CONTENT}" | grep -qx 'license = MIT OR Apache-2.0'
          tar --zstd -xOf "${SELF_PKG}" .MTREE | gzip -dc | head -n 1 | grep -qx '#mtree'
          PKG_ENTRIES="$(tar --zstd -tf "${SELF_PKG}")"
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/bin/install-in-arch'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/doc/install-in-arch/README.md'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/licenses/install-in-arch/LICENSE-MIT'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/licenses/install-in-arch/LICENSE-APACHE'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/bash-completion/completions/install-in-arch'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/zsh/site-functions/_install-in-arch'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/fish/vendor_completions.d/install-in-arch.fish'
          printf '%s\n' "${PKG_ENTRIES}" | grep -qx 'usr/share/man/man1/install-in-arch.1.gz'

      - name: Upload native Arch Linux aarch64 package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archlinux-pkg-aarch64
          path: pkg_dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [check, build, smoke-archlinux, smoke-aarch64]
    if: (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create/update the GitHub Release and upload assets
      pull-requests: read # read PR metadata for release notes
      id-token: write # OIDC token for build provenance attestation
      attestations: write # persist build provenance attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        env:
          TAG: ${{ needs.check.outputs.tag }}
          PKG_VER: ${{ needs.check.outputs.pkgver }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum \
              "install-in-arch-${TAG}-x86_64-unknown-linux-musl.tar.gz" \
              "install-in-arch-${TAG}-aarch64-unknown-linux-musl.tar.gz" \
              "install-in-arch-linux-x86_64" \
              "install-in-arch-linux-aarch64" \
              "install-in-arch-${PKG_VER}-1-x86_64.pkg.tar.zst" \
              "install-in-arch-${PKG_VER}-1-aarch64.pkg.tar.zst" \
              "install-in-arch.bash" \
              "_install-in-arch" \
              "install-in-arch.fish" \
              "install-in-arch.1.gz" \
              > SHA256SUMS.txt
          )
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Generate release PKGBUILD with verified SHA-256 sums
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["TAG"]
          raw_ver = tag[1:] if tag.startswith("v") else tag
          pkg_ver = raw_ver.replace("-", ".")
          if not re.fullmatch(r"[A-Za-z0-9._+~]+", pkg_ver):
              print(f"Error: normalized pkgver '{pkg_ver}' contains invalid characters for makepkg.", file=sys.stderr)
              sys.exit(1)

          sums_path = Path("dist/SHA256SUMS.txt")
          template_path = Path("packaging/aur/PKGBUILD")
          output_path = Path("dist/PKGBUILD")

          digests = {}
          for raw_line in sums_path.read_text(encoding="utf-8").splitlines():
              parts = raw_line.strip().split()
              if len(parts) == 2:
                  digests[parts[1]] = parts[0]

          x86_asset = f"install-in-arch-{tag}-x86_64-unknown-linux-musl.tar.gz"
          arm_asset = f"install-in-arch-{tag}-aarch64-unknown-linux-musl.tar.gz"
          sha_x86 = digests.get(x86_asset, "")
          sha_arm = digests.get(arm_asset, "")

          hex64 = re.compile(r"\A[0-9a-f]{64}\Z")
          if not hex64.fullmatch(sha_x86) or not hex64.fullmatch(sha_arm):
              print("Error: missing or invalid SHA-256 digest in dist/SHA256SUMS.txt.", file=sys.stderr)
              sys.exit(1)

          content = template_path.read_text(encoding="utf-8")
          content, pkgver_count = re.subn(
              r"(?m)^pkgver=.*$",
              lambda _: f"pkgver={pkg_ver}",
              content,
          )
          if pkgver_count != 1:
              print("Error: expected exactly one pkgver assignment in packaging/aur/PKGBUILD.", file=sys.stderr)
              sys.exit(1)

          content, tag_count = re.subn(
              r"(?m)^_tag=.*$",
              lambda _: f"_tag={tag}",
              content,
          )
          if tag_count != 1:
              print("Error: expected exactly one _tag assignment in packaging/aur/PKGBUILD.", file=sys.stderr)
              sys.exit(1)

          placeholder = "REPLACE_WITH_SHA256_FROM_RELEASE_SHA256SUMS_TXT"
          x86_old = f"sha256sums_x86_64=('{placeholder}')"
          arm_old = f"sha256sums_aarch64=('{placeholder}')"
          if content.count(x86_old) != 1 or content.count(arm_old) != 1:
              print("Error: expected fail-closed sha256sums placeholders in packaging/aur/PKGBUILD.", file=sys.stderr)
              sys.exit(1)

          content = content.replace(x86_old, f"sha256sums_x86_64=('{sha_x86}')", 1)
          content = content.replace(arm_old, f"sha256sums_aarch64=('{sha_arm}')", 1)

          if placeholder in content or "'SKIP'" in content:
              print("Error: rendered PKGBUILD still contains unverified checksum markers.", file=sys.stderr)
              sys.exit(1)

          output_path.write_text(content, encoding="utf-8")
          PY
          bash -n dist/PKGBUILD
          (
            cd dist
            sha256sum "PKGBUILD" >> SHA256SUMS.txt
          )
          cat dist/PKGBUILD
          cat dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f /tmp/pr.json /tmp/release_notes.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > /tmp/pr.json || true

          python3 - <<'PY'
          import json
          import os
          import subprocess

          pr_json_path = "/tmp/pr.json"
          notes_path = "/tmp/release_notes.md"
          notes = ""

          if os.path.exists(pr_json_path) and os.path.getsize(pr_json_path) > 0:
              try:
                  with open(pr_json_path, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
                  if isinstance(data, list):
                      merged = [p for p in data if p.get("merged_at")]
                      pr = merged[0] if merged else (data[0] if data else None)
                  elif isinstance(data, dict):
                      pr = data
                  else:
                      pr = None
                  if pr:
                      title = (pr.get("title") or "").strip()
                      body = (pr.get("body") or "").strip()
                      if body:
                          notes = f"## {title}\n\n{body}\n" if title else f"{body}\n"
              except Exception:
                  notes = ""

          if not notes.strip():
              notes = subprocess.check_output(
                  ["git", "log", "-1", "--pretty=%B"],
                  text=True,
              )

          with open(notes_path, "w", encoding="utf-8") as fh:
              fh.write(notes)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          ENCODED_TAG="$(jq -rn --arg v "${TAG}" '$v|@uri')"
          TAG_SHA=""
          if REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ENCODED_TAG}" 2>&1)"; then
            OBJ_TYPE="$(printf '%s' "${REF_JSON}" | jq -r --arg r "refs/tags/${TAG}" 'if type == "array" then ([.[] | select(.ref == $r)][0].object.type // "") elif .ref == $r then (.object.type // "") else "" end')"
            OBJ_SHA="$(printf '%s' "${REF_JSON}" | jq -r --arg r "refs/tags/${TAG}" 'if type == "array" then ([.[] | select(.ref == $r)][0].object.sha // "") elif .ref == $r then (.object.sha // "") else "" end')"
            if [ -z "${OBJ_TYPE}" ] || [ -z "${OBJ_SHA}" ]; then
              if [ "${REF_TYPE}" = "tag" ]; then
                echo "Error: remote tag ref 'refs/tags/${TAG}' was not found." >&2
                exit 1
              fi
            else
              DEPTH=0
              while [ "${OBJ_TYPE}" = "tag" ]; do
                DEPTH=$((DEPTH + 1))
                if [ "${DEPTH}" -gt 8 ]; then
                  echo "Error: annotated tag dereference depth exceeded for '${TAG}'." >&2
                  exit 1
                fi
                TAG_OBJ_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}")"
                OBJ_TYPE="$(printf '%s' "${TAG_OBJ_JSON}" | jq -r '.object.type // ""')"
                OBJ_SHA="$(printf '%s' "${TAG_OBJ_JSON}" | jq -r '.object.sha // ""')"
              done
              if [ "${OBJ_TYPE}" != "commit" ] || [ -z "${OBJ_SHA}" ]; then
                echo "Error: remote tag '${TAG}' resolved to unsupported object type '${OBJ_TYPE}'." >&2
                exit 1
              fi
              TAG_SHA="${OBJ_SHA}"
            fi
          elif [ "${REF_TYPE}" = "tag" ]; then
            echo "Error: failed to resolve remote ref for tag '${TAG}': ${REF_JSON}" >&2
            exit 1
          elif ! printf '%s' "${REF_JSON}" | grep -q 'HTTP 404'; then
            echo "Error: failed to query remote ref for tag '${TAG}': ${REF_JSON}" >&2
            exit 1
          fi

          if [ "${REF_TYPE}" = "tag" ] && [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Error: remote tag '${TAG}' points to '${TAG_SHA}', expected '${GITHUB_SHA}'." >&2
            exit 1
          fi

          RELEASE_ARGS=(
            "${TAG}"
            dist/*
            --title "${TAG}"
            --notes-file /tmp/release_notes.md
            --target "${GITHUB_SHA}"
          )
          if [ "${REF_TYPE}" = "tag" ]; then
            RELEASE_ARGS+=(--verify-tag)
          fi
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "${TAG}" &>/dev/null; then
            gh release delete "${TAG}" --yes --cleanup-tag || true
          fi
          if [ "${REF_TYPE}" != "tag" ] && [ -n "${TAG_SHA}" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${ENCODED_TAG}" &>/dev/null || true
          fi
          gh release create "${RELEASE_ARGS[@]}" 
