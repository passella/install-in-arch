[package]
name = "install-in-arch"
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
bzip2 = "0.6.1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
flate2 = "1.0"
hex = "0.4"
liblzma = "0.4"
md-5 = "0.11.0"
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression", "zstd-compression", "xz-compression", "bzip2-compression"] }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3.15"
thiserror = "2.0"
zstd = "0.14.4"
