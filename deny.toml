[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
    { crate = "block-buffer@0.10", reason = "Transitive duplicate pulled by rpm 0.30.2" },
    { crate = "cpufeatures@0.2", reason = "Transitive duplicate pulled by rpm 0.30.2" },
    { crate = "crypto-common@0.1", reason = "Transitive duplicate pulled by rpm 0.30.2" },
    { crate = "digest@0.10", reason = "Transitive duplicate pulled by rpm 0.30.2" },
    { crate = "sha2@0.10", reason = "Transitive duplicate pulled by rpm 0.30.2" },
    { crate = "syn@1", reason = "Transitive duplicate pulled by rpm 0.30.2 proc-macro dependencies" },
    { crate = "syn@2", reason = "Transitive duplicate pulled by rpm 0.30.2 proc-macro dependencies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
unused-license-exception = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "bzip2-1.0.6",
]
exceptions = [
    { crate = "install-in-arch", allow = ["LicenseRef-Unset"] },
]

[[licenses.clarify]]
crate = "install-in-arch"
expression = "LicenseRef-Unset"
license-files = []
